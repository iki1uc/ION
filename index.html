<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ION – Pulse · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">
import { ION_CORE } from "./ion.core.js";
import { ION_DASHBOARD } from "./ion.dashboard.js";

import { HUB_CORE } from "../HUB/HUB.core.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";

(async function(){

    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);

    const hub = HUB_CORE(nc, pq, tmp);
    const ion = ION_CORE(hub);
    const dash = ION_DASHBOARD(ion);

    document.getElementById("pulse").innerText = dash.pulse;
    document.getElementById("warp").innerText = dash.warp;
    document.getElementById("curvature").innerText = dash.curvature;
    document.getElementById("charge").innerText = dash.charge;
    document.getElementById("state").innerText = dash.state;

})();
</script>

</head>

<body>

<h1>ION – Pulse · iki1uc</h1>

<div class="block">
    <div class="title">Pulse</div>
    <pre id="pulse"></pre>
</div>

<div class="block">
    <div class="title">Warp (Lichtgeschwindigkeitspunkte)</div>
    <pre id="warp"></pre>
</div>

<div class="block">
    <div class="title">Curvature (Raumkrümmung)</div>
    <pre id="curvature"></pre>
</div>

<div class="block">
    <div class="title">Charge (Hyper‑Charge)</div>
    <pre id="charge"></pre>
</div>

<div class="block">
    <div class="title">State (Pulse‑Modus)</div>
    <pre id="state"></pre>
</div>

</body>
</html>
